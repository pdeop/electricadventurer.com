<svg
  width="160"
  height="160"
  viewBox="0 0 160 160"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <linearGradient id="grad-prim-compass-bolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0c040" />
      <stop offset="100%" stop-color="#7eb8d4" />
    </linearGradient>
    <linearGradient id="grad-acc-compass-bolt" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f0c040" />
      <stop offset="100%" stop-color="#fdfcf9" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <style>
    @keyframes spin-slow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .animated-ring {
      transform-origin: 80px 80px;
      animation: spin-slow 30s linear infinite;
    }
  </style>

  <!-- Outer Compass Ring -->
  <circle
    class="animated-ring"
    cx="80" cy="80" r="68"
    fill="none"
    stroke="#7eb8d4"
    stroke-width="2"
    stroke-dasharray="6,4"
    opacity="0.5"
  />
  <circle
    cx="80" cy="80" r="74"
    fill="none"
    stroke="#7eb8d4"
    stroke-width="3"
    opacity="0.75"
  />

  <!-- Mountain Backing -->
  <path d="M 20 115 L 60 65 L 80 85 L 115 50 L 155 115 Z" fill="#1e2d3d" opacity="0.9" />
  <path d="M 60 65 L 80 85 L 75 115 L 20 115 Z" fill="url(#grad-prim-compass-bolt)" opacity="0.95" />

  <!-- Compass ticks -->
  <line x1="80" y1="60" x2="80" y2="52" stroke="#7eb8d4" stroke-width="3" />
  <line x1="80" y1="100" x2="80" y2="108" stroke="#1e2d3d" stroke-width="3" />
  <line x1="60" y1="80" x2="52" y2="80" stroke="#1e2d3d" stroke-width="3" />
  <line x1="100" y1="80" x2="108" y2="80" stroke="#1e2d3d" stroke-width="3" />

  <!-- Charge Bolt -->
  <path d="M 90 30 L 55 85 L 75 85 L 60 135 L 105 75 L 85 75 Z" fill="url(#grad-acc-compass-bolt)" />

  <!-- Core Spark -->
  <circle cx="78" cy="80" r="4" fill="#f0c040" />
</svg>
