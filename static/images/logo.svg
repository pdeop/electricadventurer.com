<svg 
  width="160" 
  height="160" 
  viewBox="0 0 160 160" 
  fill="none" 
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <linearGradient id="grad-prim-compass-bolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#10b981" />
      <stop offset="100%" stopColor="#3b82f6" />
    </linearGradient>
    <linearGradient id="grad-acc-compass-bolt" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#3b82f6" />
      <stop offset="100%" stopColor="#ffffff" stopOpacity="0.4" />
    </linearGradient>
  </defs>
  <!-- Outer Compass Ring -->
  <circle
    cx="80"
    cy="80"
    r="68"
    fill="none"
    stroke="#3b82f6"
    strokeWidth="2"
    strokeDasharray="2,2"
    opacity="0.3"
  />
  <circle
    cx="80"
    cy="80"
    r="74"
    fill="none"
    stroke="#3b82f6"
    strokeWidth="4"
  />
  
  <!-- Mountain Backing -->
  <path
    d="M 20 115 L 60 65 L 80 85 L 115 50 L 155 115 Z"
    fill="#1e293b"
    opacity="0.85"
  />
  <path
    d="M 60 65 L 80 85 L 75 115 L 20 115 Z"
