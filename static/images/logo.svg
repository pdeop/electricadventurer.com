  />
  
  <!-- Compass ticks -->
  <line x1="80" y1="60" x2="80" y2="52" stroke="#3b82f6" strokeWidth="3" />
  <line x1="80" y1="100" x2="80" y2="108" stroke="#1e293b" strokeWidth="3" />
  <line x1="60" y1="80" x2="52" y2="80" stroke="#1e293b" strokeWidth="3" />
  <line x1="100" y1="80" x2="108" y2="80" stroke="#1e293b" strokeWidth="3" />

  <!-- Glowing Charge Bolt Cutting Across -->
  <path
    d="M 90 30 L 55 85 L 75 85 L 60 135 L 105 75 L 85 75 Z"
    fill="url(#grad-acc-compass-bolt)"
